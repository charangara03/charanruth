<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharanRuth - Online Shopping</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0}
.nav{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0}
.logo{font-size:22px;font-weight:bold;color:#00ff88}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding:20px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.card button{width:100%;padding:8px;background:#111;color:#fff;border:none;border-radius:8px;margin-top:8px;cursor:pointer}
.cart{position:fixed;right:0;top:0;width:300px;height:100%;background:#fff;box-shadow:-5px 0 15px #0003;padding:15px;display:none}
</style>
</head>
<body>
<div class="nav"><div class="logo">CharanRuth</div><div onclick="openCart()">🛒 Cart (<span id="c">0</span>)</div></div>
<h2 style="text-align:center;padding:20px">Welcome to CharanRuth - Gadwal Shopping!</h2>
<div class="grid" id="grid"></div>
<div class="cart" id="cartBox"><h3>Cart <span onclick="closeCart()" style="float:right;cursor:pointer">X</span></h3><div id="items"></div><h4 id="total"></h4><button onclick="alert('Order placed on WhatsApp!')" style="width:100%;padding:10px;background:#00ff88;border:none;border-radius:8px;font-weight:bold">Checkout</button></div>
<script>
let cart=0;let products=[
{name:"iPhone 15",price:79999,img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400"},
{name:"Nike Shoes",price:4999,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"Sony Headphone",price:2499,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},
{name:"T-Shirt",price:799,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"}
];
let g=document.getElementById('grid');
products.forEach(p=>{
g.innerHTML+=`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p>₹${p.price}</p><button onclick="add()">Add to Cart</button></div>`;
});
function add(){cart++;document.getElementById('c').innerText=cart;document.getElementById('items').innerHTML+=`<p>Item - ₹ added</p>`;document.getElementById('total').innerText='Total Items: '+cart;}
function openCart(){document.getElementById('cartBox').style.display='block';}
function closeCart(){document.getElementById('cartBox').style.display='none';}
</script>
</body>
</html>
