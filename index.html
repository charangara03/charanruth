<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharanRuth - Gadwal Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#2874f0;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.cart-btn{background:white;color:#2874f0;border:none;padding:8px 15px;border-radius:20px;font-weight:bold;cursor:pointer}
.cats{background:white;padding:10px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap;box-shadow:0 2px 5px #0001;position:sticky;top:53px;z-index:99;align-items:center}
.cats::-webkit-scrollbar{display:none}
.cats > button{border:1px solid #ddd;background:white;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0}
.cats > button.active{background:#2874f0;color:white;border-color:#2874f0}
.dropdown{position:relative;display:inline-block;flex-shrink:0}
.dropbtn{background:white;color:black;border:1px solid #ddd;padding:7px 14px;border-radius:20px;cursor:pointer}
.dropbtn.active{background:#2874f0 !important;color:white !important;border-color:#2874f0 !important}
.dropdown-content{display:none;position:fixed;background:white;min-width:220px;max-height:250px;overflow-y:auto;box-shadow:0 8px 16px rgba(0,0,0,.3);border-radius:10px;z-index:9999;border:1px solid #ddd}
.dropdown-content::-webkit-scrollbar{width:6px}
.dropdown-content::-webkit-scrollbar-thumb{background:#ddd;border-radius:10px}
.dropdown-content button{display:block;width:100%;text-align:left;border:none;border-radius:0;padding:11px 15px;background:white;font-weight:bold;cursor:pointer}
.dropdown-content button:hover{background:#e8f0fe}
.show{display:block !important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px}
.card{background:white;border-radius:8px;padding:10px;box-shadow:0 1px 4px #0001;text-align:center}
.card img{width:100%;height:130px;object-fit:contain}
.card h3{font-size:13px;margin:8px 0;height:32px;overflow:hidden}
.card .price{color:#388e3c;font-weight:bold;margin:5px 0}
.card button{background:#ff9f00;color:white;border:none;padding:7px 0;width:100%;border-radius:4px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="header">
  <h1>CharanRuth 🛒</h1>
  <button class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</button>
</div>

<div class="cats">
  <button class="active" onclick="filterProd('all',this)">All Products</button>
  
  <!-- Mobiles Dropdown -->
  <div class="dropdown">
    <button class="dropbtn" id="mobileBtn" onclick="toggleMenu('mobileMenu', 'mobileBtn', event)">📱 Mobiles ▼</button>
    <div class="dropdown-content" id="mobileMenu">
      <button onclick="filterSub('oppo', 'mobileBtn', 'mobileMenu')">Oppo</button>
      <button onclick="filterSub('vivo', 'mobileBtn', 'mobileMenu')">Vivo</button>
      <button onclick="filterSub('oneplus', 'mobileBtn', 'mobileMenu')">OnePlus</button>
      <button onclick="filterSub('iphone', 'mobileBtn', 'mobileMenu')">iPhone</button>
      <button onclick="filterSub('samsung', 'mobileBtn', 'mobileMenu')">Samsung</button>
      <button onclick="filterSub('redmi', 'mobileBtn', 'mobileMenu')">Redmi</button>
      <button onclick="filterSub('realme', 'mobileBtn', 'mobileMenu')">Realme</button>
      <button onclick="filterSub('infinix', 'mobileBtn', 'mobileMenu')">Infinix</button>
      <button onclick="filterSub('moto', 'mobileBtn', 'mobileMenu')">Moto</button>
      <button onclick="filterSub('honor', 'mobileBtn', 'mobileMenu')">Honor</button>
      <button onclick="filterSub('nokia', 'mobileBtn', 'mobileMenu')">Nokia</button>
      <button onclick="filterSub('lava', 'mobileBtn', 'mobileMenu')">Lava</button>
    </div>
  </div>

  <!-- Shoes Dropdown -->
  <div class="dropdown">
    <button class="dropbtn" id="shoeBtn" onclick="toggleMenu('shoeMenu', 'shoeBtn', event)">👟 Shoes ▼</button>
    <div class="dropdown-content" id="shoeMenu">
      <button onclick="filterSub('sneakers', 'shoeBtn', 'shoeMenu')">👟 Sneakers</button>
      <button onclick="filterSub('loafers', 'shoeBtn', 'shoeMenu')">👞 Loafers</button>
    </div>
  </div>

  <!-- Fashion Dropdown -->
  <div class="dropdown">
    <button class="dropbtn" id="fashionBtn" onclick="toggleMenu('fashionMenu', 'fashionBtn', event)">👕 Fashion ▼</button>
    <div class="dropdown-content" id="fashionMenu">
      <button onclick="filterSub('mens_wardrobe', 'fashionBtn', 'fashionMenu')">👔 Men's Wardrobe (Adults)</button>
      <button onclick="filterSub('boys_wear', 'fashionBtn', 'fashionMenu')">👦 Boys' Wear (Toddlers to Teens)</button>
      <button onclick="filterSub('girls_wear', 'fashionBtn', 'fashionMenu')">👧 Girls' Wear (Toddlers to Teens)</button>
      <button onclick="filterSub('womens_kids', 'fashionBtn', 'fashionMenu')">👗 Women's and Kids Wear</button>
    </div>
  </div>

  <!-- Electronics Dropdown -->
  <div class="dropdown">
    <button class="dropbtn" id="electronicsBtn" onclick="toggleMenu('electronicsMenu', 'electronicsBtn', event)">🎧 Electronics ▼</button>
    <div class="dropdown-content" id="electronicsMenu">
      <button onclick="filterSub('laptops_computers', 'electronicsBtn', 'electronicsMenu')">💻 Laptops & Computers</button>
      <button onclick="filterSub('audio_devices', 'electronicsBtn', 'electronicsMenu')">🎧 Audio Devices</button>
      <button onclick="filterSub('home_entertainment', 'electronicsBtn', 'electronicsMenu')">📺 Home Entertainment & TVs</button>
      <button onclick="filterSub('cameras_gadgets', 'electronicsBtn', 'electronicsMenu')">📷 Cameras & Gadgets</button>
      <button onclick="filterSub('smart_watches', 'electronicsBtn', 'electronicsMenu')">⌚ Smart Watches</button>
    </div>
  </div>

  <button onclick="filterProd('watches',this)">⌚ Watches</button>
  <button onclick="filterProd('sarees',this)">🥻 Sarees</button>
  <button onclick="filterProd('groceries',this)">🛒 Groceries</button>
  <button onclick="filterProd('toys',this)">🧸 Toys</button>
</div>

<div class="grid" id="grid"></div>

<script>

// --- OTHERS ---
{id:8,name:"Gadwal Pattu Saree",price:12500,cat:"sarees",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500"},
{id:10,name:"Teddy Bear 3ft",price:1499,cat:"toys",img:"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=500"}

let cart=0;

function render(list){
document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><div class="price">₹${p.price}</div><button onclick="addCart()">Add to Cart</button></div>`).join('');
}

function closeAllMenus(){
document.getElementById('mobileMenu').classList.remove('show');
document.getElementById('shoeMenu').classList.remove('show');
document.getElementById('fashionMenu').classList.remove('show');
document.getElementById('electronicsMenu').classList.remove('show');
}

function filterProd(c,btn){
closeAllMenus();
document.getElementById('mobileBtn').classList.remove('active');
document.getElementById('shoeBtn').classList.remove('active');
document.getElementById('fashionBtn').classList.remove('active');
document.getElementById('electronicsBtn').classList.remove('active');

if(btn){
  document.querySelectorAll('.cats > button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

if(c==='all') render(products);
else render(products.filter(p=>p.cat===c));
}

function toggleMenu(menuId, btnId, e){
e.stopPropagation();
const menu = document.getElementById(menuId);
const btn = document.getElementById(btnId).getBoundingClientRect();

closeAllMenus();

menu.style.top = (btn.bottom + 5) + 'px';
menu.style.left = btn.left + 'px';
menu.classList.toggle('show');
}

function filterSub(cat, btnId, menuId){
document.getElementById(menuId).classList.remove('show');

document.querySelectorAll('.cats > button').forEach(b=>b.classList.remove('active'));
document.getElementById('mobileBtn').classList.remove('active');
document.getElementById('shoeBtn').classList.remove('active');
document.getElementById('fashionBtn').classList.remove('active');
document.getElementById('electronicsBtn').classList.remove('active');

const activeBtn = document.getElementById(btnId);
activeBtn.classList.add('active');

render(products.filter(p=>p.cat===cat));
}

function addCart(){
cart++;
document.getElementById('cartCount').innerText=cart;
}

document.addEventListener('click',function(e){ 
if(!e.target.closest('.dropdown')) {
  closeAllMenus();
} 
});

render(products);
</script>
</body>
</html>
