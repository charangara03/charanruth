let cart=[];
function show(list){document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><h4>${p.name}</h4><div class="pr">₹${p.price}</div><button onclick="addCart(${p.id})">Add to Cart</button></div>`).join('')}
function filterProd(c,b){document.querySelectorAll('.fil button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(c=='all')show(products);else show(products.filter(p=>p.cat==c))}
function addCart(id){let ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else{let p=products.find(x=>x.id==id);cart.push({...p,qty:1})}document.getElementById('cc').innerText=cart.reduce((a,b)=>a+b.qty,0);alert('Added!')}
function toggleCart(){document.getElementById('cart').classList.toggle('open');let h="";let t=0;cart.forEach(i=>{t+=i.price*i.qty;h+=`<div style="display:flex;justify-content:space-between;margin:8px 0;border-bottom:1px solid #eee;padding-bottom:8px"><span>${i.name} x${i.qty}</span><span>₹${i.price*i.qty}</span></div>`});document.getElementById('cItems').innerHTML=h||"Empty";document.getElementById('tot').innerText="Total: ₹"+t}
function checkout(){if(!cart.length)return alert('Cart Empty');let m=encodeURIComponent("New Order CharanRuth%0A"+cart.map(i=>`${i.name} x${i.qty}`).join('%0A')+"%0ATotal ₹"+cart.reduce((a,b)=>a+b.price*b.qty,0));window.open(`https://wa.me/918074598359?text=${m}`,'_blank')}
show(products);
