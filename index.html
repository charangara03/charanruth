<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharanRuth - Gadwal Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#2874f0;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:22px}
.cart-btn{background:white;color:#2874f0;border:none;padding:8px 15px;border-radius:20px;font-weight:bold;cursor:pointer}
.cats{background:white;padding:10px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap;box-shadow:0 2px 5px #0001;position:sticky;top:53px;z-index:99}
.cats button{border:1px solid #ddd;background:white;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.cats button.active{background:#2874f0;color:white;border-color:#2874f0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px}
.card{background:white;border-radius:8px;padding:10px;box-shadow:0 1px 4px #0001;text-align:center}
.card img{width:100%;height:130px;object-fit:contain}
.card h3{font-size:13px;margin:8px 0;height:32px;overflow:hidden}
.card .price{color:#388e3c;font-weight:bold;margin:5px 0}
.card button{background:#ff9f00;color:white;border:none;padding:7px 0;width:100%;border-radius:4px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>CharanRuth 🛒</h1>
<button class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</button>
</div>
<div class="cats">
<button class="active" onclick="filterProd('all',this)">All Products</button>
<button onclick="filterProd('fashion',this)">👕 Fashion</button>
<button onclick="filterProd('electronics',this)">🎧 Electronics</button>
<button onclick="filterProd('sneakers',this)">👟 Sneakers</button>
<button onclick="filterProd('loafers',this)">👞 Loafers</button>
<button onclick="filterProd('watches',this)">⌚ Watches</button>
<button onclick="filterProd('sarees',this)">🥻 Gadwal Sarees</button>
<button onclick="filterProd('groceries',this)">🛒 Groceries</button>
<button onclick="filterProd('laptops',this)">💻 Laptops</button>
<button onclick="filterProd('toys',this)">🧸 Toys</button>
</div>
<div class="grid" id="grid"></div>

<script>
const products=[
{id:2,name:"Nike Air Max Shoes For Men",price:1999,cat:"sneakers",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:6,name:"Puma White Shoes Running",price:4499,cat:"sneakers",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:101,name:"Bata Formal Loafer Black Leather",price:2499,cat:"loafers",img:"https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=500"},
{id:102,name:"Woodland Brown Leather Loafer",price:3999,cat:"loafers",img:"https://images.unsplash.com/photo-1614252235316-8c857d38bcca?w=500"},
{id:103,name:"Red Chief Loafer For Men",price:2999,cat:"loafers",img:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500"},
{id:104,name:"Nike Sneakers Air Jordan Red",price:5999,cat:"sneakers",img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500"},
{id:105,name:"Adidas Sneakers White Originals",price:5499,cat:"sneakers",img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"},
{id:3,name:"Sony Bluetooth Headset 510",price:2990,cat:"electronics",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
{id:16,name:"Boat Airdopes 131 Earbuds",price:1299,cat:"electronics",img:"https://images.unsplash.com/photo-1606220588913-b3aacb4d2f46?w=500"},
{id:17,name:"JBL Go 3 Bluetooth Speaker",price:2999,cat:"electronics",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500"},
{id:4,name:"Levis T-Shirt Cotton",price:1299,cat:"fashion",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
{id:21,name:"Puma Mens Dry Fit T-Shirt",price:999,cat:"fashion",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
{id:22,name:"Levis Slim Blue Jeans Men",price:2499,cat:"fashion",img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500"},
{id:23,name:"Women Cotton Kurta Set",price:1899,cat:"fashion",img:"https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=500"},
{id:24,name:"Roadster Checked Shirt Men",price:1299,cat:"fashion",img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500"},
{id:25,name:"H&M Girls Summer Dress",price:1499,cat:"fashion",img:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?w=500"},
{id:7,name:"Fastrack Watch For Men",price:3999,cat:"watches",img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=500"},
{id:8,name:"Gadwal Pattu Saree Silk",price:12500,cat:"sarees",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500"},
{id:9,name:"HP Laptop i7 16GB",price:65999,cat:"laptops",img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"},
{id:10,name:"Teddy Bear 3ft Big",price:1499,cat:"toys",img:"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=500"}
];
let cart=0;
function render(list){
 document.getElementById('grid').innerHTML=list.map(p=>`
  <div class="card">
   <img src="${p.img}">
   <h3>${p.name}</h3>
   <div class="price">₹${p.price}</div>
   <button onclick="addCart()">Add to Cart</button>
  </div>
 `).join('');
}
function filterProd(c,btn){
 document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 if(c==='all') render(products);
 else render(products.filter(p=>p.cat===c));
}
function addCart(){
 cart++;
 document.getElementById('cartCount').innerText=cart;
}
render(products);
</script>
</body>
</html>
